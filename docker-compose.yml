version: "3.9"

services:
  backend:
    build: ./backend
    container_name: respilot-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/files:/app/files
      - ./backend/indexes:/app/indexes
      - ./backend/logs:/app/logs
      - respilot-db:/app           # persists respilot.db
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: respilot-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  respilot-db:
